name: daily
# 00:05 IST: read insights for every post into metrics/.
on:
  schedule:
    - cron: "35 18 * * *"
  workflow_dispatch:
concurrency:
  group: house
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python ops/insights.py
      - run: |
          git config user.name "pawveda-house"
          git config user.email "house@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet || (git commit -m "daily: insights $(date -u +%F)" && git pull --rebase -X ours && git push)
