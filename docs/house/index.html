<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PawVeda House</title>
<meta name="description" content="Live view of the @pawveda.in Instagram run: what posts next, the plan, and what reaches people.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#170E07">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Lexend:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a cocoa control room (the house is the AI, and cocoa is the AI's ground). Pictures of the real posts carry the page;
   numbers are big, labels are one line, and everything longer opens in a side sheet. Desktop: tabs in the header. Phone: a bottom tab bar. */
:root {
  --bg: #170E07; --panel: #23160C; --panel-2: #2D1C10; --raise: #38241A;
  --line: rgba(253,246,227,.08); --line-2: rgba(253,246,227,.14);
  --fg: #FDF6E3; --fg-2: rgba(253,246,227,.68); --fg-3: rgba(253,246,227,.44);
  --terra: #E3906F; --terra-2: #CC785C; --terra-glow: rgba(227,144,111,.16);
  --sage: #8EB89B; --ok: #7FC98C; --warn: #F2A55A; --bad: #F07F7F;
  --display: "Fraunces", Georgia, serif;
  --body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 18px; --r-sm: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-weight: 400; font-size: 15px; line-height: 1.45; margin: 0; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; }
a { color: var(--terra); }
:focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin-inline: auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ring-day { --p: 0; width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(var(--terra) calc(var(--p) * 1turn), var(--line-2) 0); display: grid; place-items: center; flex: none; }
.ring-day span { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 500; }
.logo b { font-family: var(--display); font-weight: 400; font-size: 21px; letter-spacing: -.01em; white-space: nowrap; }
.logo small { display: block; font-size: 11px; color: var(--fg-3); line-height: 1.1; white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tab { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 999px; font-size: 14px; color: var(--fg-2); position: relative; }
.tab:hover { color: var(--fg); }
.tab[aria-current="page"] { background: var(--raise); color: var(--fg); }
.tab .n { font-family: var(--mono); font-size: 10.5px; background: var(--terra); color: #1a0e06; border-radius: 999px; padding: 0 6px; line-height: 17px; font-weight: 500; }
.iconbtn { all: unset; cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--fg-2); border: 1px solid var(--line); flex: none; }
.iconbtn:hover { color: var(--fg); border-color: var(--line-2); }
@media (max-width: 820px) {
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; border-radius: 0; border: 0; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); justify-content: space-around; z-index: 25; }
  .tab { flex-direction: column; gap: 3px; padding: 6px 8px; font-size: 11px; border-radius: 12px; min-width: 56px; justify-content: center; }
  .tab[aria-current="page"] { background: transparent; color: var(--terra); }
  .tab svg.i { width: 22px; height: 22px; }
  .tab .n { position: absolute; top: 0; right: 6px; }
  .top-in .iconbtn { margin-left: auto; }
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; }
}
@media (min-width: 821px) { .tab svg.i { display: none; } }

main { padding-block: 26px 64px; }
.view { display: flex; flex-direction: column; gap: 28px; }
@media (prefers-reduced-motion: no-preference) { .view > * { animation: up .5s cubic-bezier(.2,.8,.2,1) both; } .view > *:nth-child(2) { animation-delay: .04s; } .view > *:nth-child(3) { animation-delay: .08s; } .view > *:nth-child(4) { animation-delay: .12s; } @keyframes up { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } } }
.h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.h h2 { margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); font-weight: 500; }
.h .link { all: unset; cursor: pointer; font-size: 13px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 4px; }
.h .link:hover { color: var(--fg); }
.greet { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.greet h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4.4vw, 48px); line-height: 1.02; letter-spacing: -.02em; }
.greet h1 em { font-style: normal; color: var(--terra); }
.greet p { margin: 6px 0 0; color: var(--fg-2); font-size: 14px; }
.chipbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13.5px; color: var(--fg-2); }
.chipbtn:hover { color: var(--fg); border-color: var(--line-2); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; overflow: hidden; }
.kpi .l { font-size: 12.5px; color: var(--fg-2); display: flex; align-items: center; gap: 8px; }
.kpi .v { font-family: var(--display); font-size: clamp(38px, 4.6vw, 54px); line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kpi .v.t { color: var(--terra); }
.kpi .s { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); min-height: 20px; }
.delta { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 999px; }
.delta.up { color: var(--ok); background: rgba(127,201,140,.12); } .delta.down { color: var(--bad); background: rgba(240,127,127,.12); } .delta.flat { color: var(--fg-3); background: var(--line); }
.kpi svg.spark { position: absolute; right: 14px; top: 16px; width: 76px; height: 30px; }

/* home grid */
.duo { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: stretch; }
@media (max-width: 900px) { .duo { grid-template-columns: minmax(0, 1fr); } }
.next { position: relative; border-radius: var(--r); overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 420px; }
.next .art { all: unset; cursor: pointer; position: relative; flex: 1; min-height: 300px; display: block; }
.next .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.next .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,14,7,.1) 0%, rgba(23,14,7,0) 35%, rgba(23,14,7,.86) 100%); }
.next .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px; z-index: 1; display: flex; flex-direction: column; gap: 8px; }
.next .row { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; background: rgba(23,14,7,.6); border: 1px solid rgba(253,246,227,.16); color: var(--fg); backdrop-filter: blur(6px); white-space: nowrap; }
.tag i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tag.terra { background: var(--terra); color: #1a0e06; border-color: transparent; font-weight: 500; }
.next h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 2.6vw, 32px); line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; }
.next .cd { position: absolute; top: 16px; left: 16px; z-index: 1; display: flex; flex-direction: column; }
.next .cd small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-2); }
.next .cd b { font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 18px rgba(0,0,0,.4); }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.act { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 8px; border-radius: 12px; border: 1px solid var(--line-2); background: transparent; font-size: 13.5px; font-weight: 500; transition: background .15s, border-color .15s, transform .15s; }
.act:hover:not(:disabled) { background: var(--panel-2); transform: translateY(-1px); }
.act:disabled { opacity: .4; cursor: not-allowed; }
.act[aria-pressed="true"][data-d="approve"] { background: rgba(127,201,140,.16); border-color: var(--ok); color: var(--ok); }
.act[aria-pressed="true"][data-d="edit"] { background: rgba(242,165,90,.16); border-color: var(--warn); color: var(--warn); }
.act[aria-pressed="true"][data-d="cut"] { background: rgba(240,127,127,.16); border-color: var(--bad); color: var(--bad); }

.todo { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; min-width: 0; }
.todo .big { display: flex; align-items: baseline; gap: 10px; margin: 2px 4px 12px; }
.todo .big b { font-family: var(--display); font-weight: 400; font-size: 54px; line-height: .9; letter-spacing: -.03em; }
.todo .big span { color: var(--fg-2); font-size: 14px; }
.items { display: flex; flex-direction: column; gap: 2px; }
.item { all: unset; cursor: pointer; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 16px; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 12px; }
.item:hover { background: var(--panel-2); }
.item .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.item .ic.hot { background: rgba(240,127,127,.14); color: var(--bad); }
.item .ic.soon { background: rgba(242,165,90,.14); color: var(--warn); }
.item .ic.calm { background: var(--line); color: var(--fg-2); }
.item .t { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .due { font-family: var(--mono); font-size: 11.5px; color: var(--fg-3); white-space: nowrap; }
.item .ch { color: var(--fg-3); }
.clear { display: grid; place-items: center; gap: 8px; padding: 34px 10px; text-align: center; color: var(--fg-2); }
.clear svg.i { width: 36px; height: 36px; color: var(--ok); }

/* week strip */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .strip { grid-template-columns: repeat(7, 104px); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; } .strip > * { scroll-snap-align: start; } }
.day { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.day .d { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--fg-3); }
.day .d b { font-weight: 500; color: var(--fg-2); }
.day.today .d b { color: var(--terra); }
.pic { position: relative; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: var(--panel-2); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ring, transparent); transition: transform .2s; }
.day:hover .pic { transform: translateY(-3px); }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .fmt { position: absolute; right: 7px; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: rgba(23,14,7,.62); display: grid; place-items: center; color: var(--fg); }
.pic .fmt svg.i { width: 12px; height: 12px; }
.pic .badge { position: absolute; left: 7px; bottom: 7px; font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(23,14,7,.72); color: var(--fg); display: inline-flex; gap: 4px; align-items: center; }
.pic .badge svg.i { width: 11px; height: 11px; }
.pic.empty { box-shadow: none; border: 1.5px dashed var(--line-2); background: transparent; display: grid; place-items: center; color: var(--fg-3); }
.day .st { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* lesson */
.lesson { background: linear-gradient(135deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px; align-items: center; }
@media (max-width: 900px) { .lesson { grid-template-columns: minmax(0, 1fr); } }
.lesson h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: clamp(28px, 3.2vw, 40px); line-height: 1.04; letter-spacing: -.02em; }
.lesson h3 em { font-style: normal; color: var(--terra); }
.lesson p { margin: 0; color: var(--fg-2); font-size: 13.5px; }
.vs { display: flex; flex-direction: column; gap: 16px; }
.vs-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 64px; gap: 12px; align-items: center; }
.vs-row .lbl { font-size: 13px; color: var(--fg-2); }
.vs-row .bar { height: 26px; border-radius: 8px; background: var(--line); overflow: hidden; }
.vs-row .bar span { display: block; height: 100%; border-radius: 8px; background: var(--terra); transform-origin: left; }
.vs-row .bar span.feed { background: var(--fg-3); }
.vs-row .num { font-family: var(--display); font-size: 30px; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .vs-row .bar span { animation: grow .9s cubic-bezier(.2,.8,.2,1) both .15s; } @keyframes grow { from { transform: scaleX(0); } } }
.faces { display: flex; margin-top: 14px; }
.faces img, .faces .ph { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--panel-2); margin-left: -8px; background: var(--raise); }
.faces img:first-child { margin-left: 0; }

/* team */
.team { display: flex; flex-wrap: wrap; gap: 8px; }
.mate { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }
.mate:hover { color: var(--fg); border-color: var(--line-2); }
.mate i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); }
.mate i.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(127,201,140,.14); } .mate i.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(242,165,90,.14); } .mate i.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(240,127,127,.14); }

/* plan */
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.seg button { all: unset; cursor: pointer; padding: 7px 16px; border-radius: 999px; font-size: 13.5px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .cal { gap: 4px; } }
.cal .wd { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); text-align: center; padding-bottom: 2px; }
.cell { all: unset; cursor: pointer; position: relative; aspect-ratio: 4 / 5; border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); display: block; min-width: 0; }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.cell:hover img { transform: scale(1.04); }
.cell .dn { position: absolute; left: 6px; top: 6px; font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 6px; background: rgba(23,14,7,.72); color: var(--fg); }
.cell .dot { position: absolute; right: 7px; top: 7px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(23,14,7,.8); }
.cell .occ { position: absolute; left: 6px; right: 6px; bottom: 6px; font-size: 10.5px; font-weight: 500; text-align: center; padding: 2px 4px; border-radius: 6px; background: var(--terra); color: #1a0e06; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .rch { position: absolute; left: 6px; bottom: 6px; font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: rgba(23,14,7,.75); color: var(--ok); }
.cell.out { opacity: .32; cursor: default; }
.cell.gap { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); background-image: repeating-linear-gradient(135deg, transparent 0 8px, var(--line) 8px 9px); }
.cell.gap .em { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg-3); font-size: 11px; text-align: center; padding: 4px; }
.cell.today { box-shadow: 0 0 0 2px var(--terra); }
.cell .more { position: absolute; right: 6px; bottom: 6px; font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 6px; background: rgba(23,14,7,.75); }
@media (max-width: 560px) { .cell .dn { font-size: 9.5px; left: 3px; top: 3px; padding: 0 4px; } .cell .occ, .cell .rch { font-size: 8.5px; left: 3px; right: 3px; bottom: 3px; } .cell .rch { right: auto; } .cell .dot { right: 4px; top: 4px; width: 7px; height: 7px; } .cell .em { font-size: 9px; } }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; max-width: 560px; margin-inline: auto; border-radius: var(--r); overflow: hidden; }
.g { all: unset; cursor: pointer; position: relative; aspect-ratio: 4 / 5; background: var(--panel); display: block; }
.g img { width: 100%; height: 100%; object-fit: cover; display: block; }
.g .fmt { position: absolute; right: 7px; top: 7px; color: var(--fg); filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
.g .lab { position: absolute; left: 7px; bottom: 7px; font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 999px; background: rgba(23,14,7,.72); display: inline-flex; gap: 4px; align-items: center; }
.g .lab.up { background: var(--terra); color: #1a0e06; }
.g .lab svg.i { width: 11px; height: 11px; }
.g.cut img { filter: grayscale(1); opacity: .3; }
.stories { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
.story { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
.story .o { width: 68px; height: 68px; border-radius: 50%; padding: 3px; background: conic-gradient(from 210deg, var(--terra), #F2C3A8, var(--terra-2), var(--terra)); }
.story .o img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--bg); display: block; }
.story small { font-size: 11px; color: var(--fg-3); font-family: var(--mono); }

/* numbers */
.rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.rcell { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 12px 14px; text-align: center; min-width: 0; }
.ring { --p: 0; width: 110px; height: 110px; border-radius: 50%; padding: 8px; background: conic-gradient(var(--terra) calc(var(--p) * 1turn), var(--line-2) 0); }
.ring > * { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: grid; place-items: center; border: 3px solid var(--panel); background: var(--raise); color: var(--fg-3); }

.acts.one { grid-template-columns: 1fr; }

<body>
<header class="top gut">
  <div class="wrap top-in">
    <div class="logo">
      <div class="ring-day" id="dayring" aria-hidden="true"><span id="daynum">–</span></div>
      <div><b>PawVeda House</b><small id="daysub">@pawveda.in</small></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <span class="live" id="live" title="Refreshes every 5 minutes"><i></i><span>Live</span></span>
  </div>
</header>
<main class="gut"><div class="wrap" id="main"><div class="empty-big"><b>Loading…</b></div></div></main>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-h"><button class="iconbtn" id="sheet-prev" type="button" aria-label="Previous"></button><button class="iconbtn" id="sheet-next" type="button" aria-label="Next"></button><span class="grow" id="sheet-title"></span><button class="iconbtn" id="sheet-x" type="button" aria-label="Close"></button></div>
  <div class="sheet-b" id="sheet-b"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const BASE = 'https://raw.githubusercontent.com/dhruvshahi10/pawveda-ops/main/';
  const TRIAL = { start: '2026-10-20', end: '2026-11-19', days: 31 };
  const OCC = { '2026-10-20': 'Dussehra', '2026-11-06': 'Dhanteras', '2026-11-08': 'Diwali', '2026-11-11': 'Bhai Dooj', '2026-11-19': 'Trial ends' };

  const IC = {

    eye: 'M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2', plus: 'M12 5v14M5 12h14', ext: 'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6'

  const when = (iso) => new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: IST });

  const kindIcon = (k) => k === 'reel' || k === 'story_video' ? 'reel' : k === 'carousel' ? 'carousel' : 'image';
  const kindName = (k) => k === 'reel' ? 'Reel' : k === 'carousel' ? 'Carousel' : k === 'story_video' ? 'Story' : 'Image';
  const dateOf = (e) => isoDay(e.slot);
  const thumb = (e) => e ? 'thumbs/' + e.id + '.jpg' : null;
  const mediaUrl = (path) => BASE + path;
  function onThumbError(i, e) { i.onerror = null; const m = (e.media || [])[0]; if (m && !m.endsWith('.mp4')) i.src = mediaUrl(m); else i.style.visibility = 'hidden'; }
  function pthumb(e, eager) { const i = img(thumb(e), '', eager); i.onerror = () => onThumbError(i, e); return i; }

  function statusOf(e) {
    if (state.pub[e.id] || e.status === 'published') return 'posted';

    if (Date.now() > new Date(e.slot).getTime() + 10 * 60e3) return 'late'; return 'ready';
  }
  const feedQ = () => state.q.filter((e) => e.kind !== 'story_video');
  const nextPost = () => feedQ().filter((e) => new Date(e.slot).getTime() > Date.now() - 10 * 60e3 && !['posted', 'cut'].includes(statusOf(e))).sort((a, b) => a.slot.localeCompare(b.slot))[0] || null;
  function metricPosts() {
    const byMedia = {}; Object.entries(state.pub).forEach(([id, v]) => { if (v.media_id) byMedia[v.media_id] = id; });
    const byId = Object.fromEntries(state.q.map((e) => [e.id, e]));
    return ((state.latest || {}).posts || []).map((p) => {
      const qid = byMedia[p.media_id]; const e = byId[qid] || null; const t = p.timestamp.replace('+0000', 'Z');
      const run = e && e.runtime_s; const avg = p.ig_reels_avg_watch_time ? Math.round(p.ig_reels_avg_watch_time / 100) / 10 : null;
      return { e, title: (e && e.hook) || p.hook || '', date: isoDay(t), at: t, isReel: p.type === 'reel', format: p.type === 'reel' ? 'Reel' : p.type === 'carousel_album' ? 'Carousel' : 'Image', reach: Number(p.reach) || 0, views: p.views, avg, link: p.permalink, inTrial: isoDay(t) >= TRIAL.start };
    });

  /* ---------- chrome ---------- */
  const TABS = [['home', 'Home'], ['plan', 'Plan'], ['numbers', 'Numbers']];

    TABS.forEach(([k, l]) => { const b = el('button', 'tab'); b.type = 'button'; if (state.view === k) b.setAttribute('aria-current', 'page'); b.append(icon(k), document.createTextNode(l)); b.addEventListener('click', () => go(k)); t.appendChild(b); });
    const start = new Date(TRIAL.start + 'T00:00:00+05:30').getTime(); const d = Math.floor((Date.now() - start) / 864e5) + 1; const dd = Math.max(0, Math.min(TRIAL.days, d));
    $('#daynum').textContent = d < 1 ? '0' : d > TRIAL.days ? '✓' : String(dd); $('#dayring').style.setProperty('--p', dd / TRIAL.days);
    $('#daysub').textContent = d >= 1 && d <= TRIAL.days ? `Trial day ${dd} of ${TRIAL.days}` : '@pawveda.in';
    const lv = $('#live'); lv.classList.toggle('bad', !!state.err); lv.querySelector('span').textContent = state.err ? 'Offline' : state.loadedAt ? 'Live · ' + hm(state.loadedAt) : 'Loading';
  }
  function sparkline(vals) {
    const ns = 'http://www.w3.org/2000/svg'; const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '0 0 76 30'); svg.setAttribute('class', 'spark'); svg.setAttribute('aria-hidden', 'true');

  function errorBox() { const e = el('div', 'empty-big'); e.append(el('b', null, 'Couldn’t load the numbers'), el('span', null, 'Check your connection. The page tries again every minute.')); return e; }
  function go(k) { state.view = k; setHash(k); if ($('#sheet').classList.contains('on')) { $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); state.sheet = null; } render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  async function getJSON(path) { const r = await fetch(BASE + path + '?t=' + Math.floor(Date.now() / 60e3), { cache: 'no-store' }); if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); }
  async function load() {
    try {
      const [q, pub, latest] = await Promise.all([getJSON('queue/schedule.json'), getJSON('state/published.json'), getJSON('metrics/latest.json')]);
      const days = []; const s = new Date('2026-10-21T00:00:00Z').getTime(); for (let t = s; isoDay(t) <= today(); t += 864e5) days.push(isoDay(t));
      const fol = (await Promise.allSettled(days.map((d) => getJSON('metrics/' + d + '.json').then((x) => ({ day: d, followers: (x.account || {}).followers_count }))))).filter((x) => x.status === 'fulfilled' && x.value.followers != null).map((x) => x.value);
      const rt = await fetch('runtimes.json', { cache: 'no-store' }).then((r) => r.ok ? r.json() : {}).catch(() => ({}));
      q.forEach((e) => { if (rt[e.id]) e.runtime_s = rt[e.id]; });
      state.q = q.sort((a, b) => a.slot.localeCompare(b.slot)); state.pub = pub || {}; state.latest = latest; state.fol = fol; state.loadedAt = new Date().toISOString(); state.err = null;
    } catch (err) { state.err = String(err); }
    const keep = state.sheet; render(); if (keep && keep.startsWith('post:') && $('#sheet').classList.contains('on')) { const sc = $('#sheet-b').scrollTop; openPost(keep.slice(5)); $('#sheet-b').scrollTop = sc; }
  }
  $('#sheet-x').appendChild(icon('x')); $('#sheet-prev').appendChild(icon('left')); $('#sheet-next').appendChild(icon('chev'));
  $('#sheet-x').addEventListener('click', closeSheet); $('#scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (!$('#sheet').classList.contains('on')) return; if (e.key === 'Escape') closeSheet(); else if (e.key === 'ArrowRight') slideTo(state.slide + 1); else if (e.key === 'ArrowLeft') slideTo(state.slide - 1); });
  setInterval(() => { const p = nextPost(); if (p) { const t = until(new Date(p.slot) - Date.now()); const a = $('#cd'), b = $('#cd-h'); if (a) a.textContent = t; if (b) b.textContent = t; } chrome(); }, 30e3);
  setInterval(load, 5 * 60e3); document.addEventListener('visibilitychange', () => { if (!document.hidden && state.loadedAt && Date.now() - new Date(state.loadedAt) > 60e3) load(); });
  const hs = (location.hash || '').slice(1); if (['home', 'plan', 'numbers'].includes(hs)) state.view = hs;
  render(); load().then(() => { if (/^\d{4}-\d\d-\d\d-/.test(hs)) openPost(hs); });
})();
</script>
